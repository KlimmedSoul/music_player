<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="Музыка под твоё настроение. Музыкальная библиотека VK, SoundCloud и Spotify на HTML, CSS и JavaScript."
    />
    <title>MyPlayer — After dark</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="api.js" defer></script>
    <script src="player.js" defer></script>
    <script src="artwork.js" defer></script>
    <script src="collections.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-logo" viewBox="0 0 24 24">
          <path d="m1 2 22-1-1 22-21-1z" fill="currentColor" />
          <path d="m5 18 2-12 5 8 5-9 2 13" stroke="#111" stroke-width="2.3" fill="none" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="7.5" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="i-library" viewBox="0 0 24 24">
          <path d="M4 3v18M9 3v18m5-17 6 17M14 3l3-1 6 18-3 1z" />
        </symbol>
        <symbol id="i-bell" viewBox="0 0 24 24">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9m3 12h6" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 6v6l4 2" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 4v16M4 12h16" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="i-heart" viewBox="0 0 24 24">
          <path
            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"
          />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="m8 4 13 8L8 20z" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
          <path d="M7 5v14M17 5v14" stroke-width="5" />
        </symbol>
        <symbol id="i-next" viewBox="0 0 24 24">
          <path d="m4 5 12 7-12 7z" fill="currentColor" stroke="none" />
          <path d="M19 5v14" stroke-width="3" />
        </symbol>
        <symbol id="i-device" viewBox="0 0 24 24">
          <rect x="3" y="3" width="12" height="14" rx="2" />
          <rect x="17" y="9" width="5" height="12" rx="1" />
          <path d="M6 21h6m-3-4v4" />
        </symbol>
        <symbol id="i-shuffle" viewBox="0 0 24 24">
          <path
            d="M3 6h3c4 0 8 12 12 12h3m-4-4 4 4-4 4M3 18h3c1 0 2-1 3-3m5-6c1-2 3-3 4-3h3m-4-4 4 4-4 4"
          />
        </symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24">
          <path
            d="M4 10V7a3 3 0 0 1 3-3h13m-4-3 4 3-4 3M20 14v3a3 3 0 0 1-3 3H4m4-3-4 3 4 3"
          />
        </symbol>
        <symbol id="i-volume" viewBox="0 0 24 24">
          <path
            d="M3 9h4l5-5v16l-5-5H3zm13-2c3 3 3 7 0 10m3-13c5 5 5 11 0 16"
          />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="m9 5 7 7-7 7" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m5 5 14 14M5 19 19 5" />
        </symbol>
      </defs>
    </svg>
    <a class="skip-link" href="#main">К содержимому</a>
    <aside class="sidebar">
      <a href="#home" class="brand"
        ><svg><use href="#i-logo" /></svg>MyPlayer</a
      >
      <nav aria-label="Основная навигация" class="desktop-nav">
        <button data-page="home" class="nav-link active">
          <svg><use href="#i-home" /></svg>Главная
        </button>
        <button data-page="search" class="nav-link">
          <svg><use href="#i-search" /></svg>Поиск
        </button>
        <button data-page="recommendations" class="nav-link"><svg><use href="#i-shuffle" /></svg>Для тебя</button>
      </nav>
      <div class="library-heading">
        <button data-page="library">
          <svg><use href="#i-library" /></svg>Моя медиатека</button
        ><button
          class="icon-button"
          id="open-settings"
          aria-label="Подключение источников"
        >
          <svg><use href="#i-plus" /></svg>
        </button>
      </div>
      <div class="sidebar-chips">
        <span>VK</span><span>SoundCloud</span><span>Spotify</span><span>YouTube Music</span>
      </div>
      <div class="sidebar-caption">Твоя коллекция <span>Из сервисов</span></div>
      <div id="sidebar-list"></div>
      <div class="sidebar-bottom">
        <span class="online-dot"></span>Музыка всегда с тобой<small
          >Слушай. Открывай. Повторяй.</small
        >
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <button class="avatar" id="profile-button" aria-label="Открыть профиль">
          А
        </button>
        <div class="greeting">
          <span>ЛИЧНЫЙ АРХИВ / AFTER DARK</span>
          <h1 id="page-title">
            Привет, меломан<span class="green-dot">.</span>
          </h1>
        </div>
        <div class="header-actions">
          <button
            class="icon-button notification"
            id="notifications"
            aria-label="Статус источников"
          >
            <svg><use href="#i-bell" /></svg></button
          ><button
            class="icon-button"
            id="history"
            aria-label="Недавно прослушано"
          >
            <svg><use href="#i-clock" /></svg>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="content-footer">
        <svg><use href="#i-logo" /></svg><span>MYPLAYER / SOUND IN INK</span
        ><span class="footer-year">Чёрным по белому.</span>
      </footer>
    </div>
    <div class="bottom-dock">
    <section class="player" aria-label="Музыкальный плеер">
      <button
        class="now-playing"
        id="open-current"
        aria-label="Открыть текущую подборку"
      >
        <img id="player-cover" src="assets/cover.svg" alt="Обложка текущего трека" referrerpolicy="no-referrer" /><span
          ><strong id="player-title">Выбери трек</strong
          ><small id="player-artist">Твоя музыка ждёт</small></span
        ><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button
        class="icon-button like-button"
        id="like-track"
        aria-label="Добавить в избранное"
        aria-pressed="false"
      >
        <svg><use href="#i-plus" /></svg>
      </button>
      <div class="playback">
        <div class="playback-buttons">
          <button
            class="icon-button desktop-control"
            id="shuffle"
            aria-label="Перемешать"
            aria-pressed="false"
          >
            <svg><use href="#i-shuffle" /></svg></button
          ><button
            class="icon-button desktop-control previous"
            id="previous"
            aria-label="Предыдущий трек"
          >
            <svg><use href="#i-next" /></svg></button
          ><button
            class="play-button"
            id="play-toggle"
            aria-label="Воспроизвести"
            aria-pressed="false"
          >
            <svg><use href="#i-play" /></svg></button
          ><button
            class="icon-button desktop-control"
            id="next"
            aria-label="Следующий трек"
          >
            <svg><use href="#i-next" /></svg></button
          ><button
            class="icon-button desktop-control"
            id="repeat"
            aria-label="Повтор"
            aria-pressed="false"
          >
            <svg><use href="#i-repeat" /></svg>
          </button>
        </div>
        <div class="progress-row">
          <span id="current-time">0:00</span
          ><input
            id="progress"
            type="range"
            min="0"
            max="360"
            value="0"
            aria-label="Позиция воспроизведения"
          /><span>0:00</span>
        </div>
      </div>
      <div class="player-extras">
        <button class="icon-button" id="device" aria-label="Устройства">
          <svg><use href="#i-device" /></svg></button
        ><svg><use href="#i-volume" /></svg
        ><input
          type="range"
          id="volume"
          min="0"
          max="100"
          value="70"
          aria-label="Громкость"
        />
      </div>
      <div class="mobile-progress"><span id="mobile-progress"></span></div>
    </section>
    <nav class="mobile-nav" aria-label="Основная навигация">
      <button data-page="home" class="active">
        <svg><use href="#i-home" /></svg><span>Главная</span>
      </button>
      <button data-page="search">
        <svg><use href="#i-search" /></svg><span>Поиск</span>
      </button>
      <button data-page="library">
        <svg><use href="#i-library" /></svg><span>Моя медиатека</span>
      </button>
      <button data-page="recommendations"><svg><use href="#i-shuffle" /></svg><span>Для тебя</span></button>
    </nav>
    </div>
    <dialog id="modal">
      <button class="icon-button modal-close" aria-label="Закрыть">
        <svg><use href="#i-close" /></svg>
      </button>
      <div id="modal-body"></div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
